# Production: static SPA only. The AWS load balancer routes /api, /sync and
# /ai to their services before requests ever reach this container.
# (Local docker compose mounts nginx.local.conf instead, which adds proxies.)
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # NB: no add_header inside locations: nginx would then drop every security
  # header above for that location. Caching uses `expires` instead.
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 1y; }   # content-hashed filenames
  location / { try_files $uri /index.html; expires -1; }
}
