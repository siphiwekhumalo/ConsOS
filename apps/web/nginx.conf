# Local stand-in for the AWS ALB path routing.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;   # sync batches; file bytes go straight to S3

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/  { proxy_pass http://api-core:3000;      proxy_set_header Host $host; }
  location /sync/ { proxy_pass http://sync-service:8081;  proxy_set_header Host $host; }
  location /ai/   { proxy_pass http://ai-engine:8000;     proxy_set_header Host $host; proxy_read_timeout 120s; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
