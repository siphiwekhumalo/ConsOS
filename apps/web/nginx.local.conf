# Local docker compose only: stands in for the AWS load balancer's path routing.
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;     # keep the host port on redirects (container listens on 80, host on 8070)
  client_max_body_size 6m;   # sync batches; file bytes go straight to S3

  # Re-resolve service names via Docker's DNS, so restarting one service (new IP)
  # never leaves the gateway pointing at a dead address. Variables in proxy_pass
  # force per-request resolution instead of resolving once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_core     http://api-core:3000;
  set $sync_service http://sync-service:8081;
  set $ai_engine    http://ai-engine:8000;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/  { proxy_pass $api_core;     proxy_set_header Host $host; }
  location /sync/ { proxy_pass $sync_service; proxy_set_header Host $host; }
  location /ai/   { proxy_pass $ai_engine;    proxy_set_header Host $host; proxy_read_timeout 120s; }

  location = /healthz { return 200 "ok\n"; }
  location /assets/ { expires 1y; }
  location / { try_files $uri /index.html; }
}
