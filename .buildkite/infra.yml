# ConstructOS infrastructure (Terraform, af-south-1). Run this pipeline manually
# or on changes under infra/. It plans, waits for a human to approve, then
# applies the same commit.
#
# Required pipeline environment (Buildkite pipeline settings, not in code):
#   TF_STATE_BUCKET  S3 bucket for Terraform state (private, versioned, KMS)
#   TF_LOCK_TABLE    DynamoDB table for state locking
# INFRA_QUEUE (default "infra"): a queue in your cluster whose agents may manage the stack.

env:
  DEPLOY_ENV: production

steps:
  - label: ":terraform: Plan (production)"
    key: plan
    command: bash .buildkite/scripts/terraform.sh plan
    agents:
      queue: "${INFRA_QUEUE:-infra}"
    concurrency: 1
    concurrency_group: "constructos/production/terraform"
    timeout_in_minutes: 20

  - block: ":terraform: Apply these infrastructure changes?"
    key: apply-gate
    prompt: "Review the plan annotation above. Apply runs against the same commit."

  - label: ":terraform: Apply (production)"
    depends_on: apply-gate
    command: bash .buildkite/scripts/terraform.sh apply
    agents:
      queue: "${INFRA_QUEUE:-infra}"
    concurrency: 1
    concurrency_group: "constructos/production/terraform"
    timeout_in_minutes: 60
