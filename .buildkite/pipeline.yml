# ConstructOS: CI/CD to production (https://baheka-construct-os.com)
#
# Every branch:  tests (TypeScript + database isolation, Go, Python, Terraform, shell)
# main only:     uploads .buildkite/release.yml (build & push images -> manual
#                release gate -> migrations + rolling ECS deploy -> smoke test)
#
# Agent queues:
#   Test steps name no queue, so they run on your cluster's DEFAULT queue
#   (any agent with Docker; no AWS permissions needed).
#   Release steps run on the queue in DEPLOY_QUEUE (default "deploy"). Create
#   that queue in your Buildkite cluster and give its agents the IAM policy from
#   the Terraform output `buildkite_deploy_policy_arn`.
#
# Infrastructure changes:      .buildkite/infra.yml
# Organisation provisioning:   .buildkite/provision.yml

env:
  DEPLOY_ENV: production
  DOCKER_BUILDKIT: "1"

steps:
  - group: ":white_check_mark: Tests"
    key: tests
    steps:
      - label: ":typescript: TypeScript: DB isolation, audit, formulas, API, web build"
        key: test-js
        command: bash .buildkite/scripts/test-js.sh
        timeout_in_minutes: 30
        retry:
          automatic:
            - exit_status: -1 # agent lost
              limit: 2

      - label: ":golang: Edge-sync service (Go)"
        key: test-go
        command: bash .buildkite/scripts/test-go.sh
        timeout_in_minutes: 15

      - label: ":python: AI engine (Python)"
        key: test-python
        command: bash .buildkite/scripts/test-python.sh
        timeout_in_minutes: 15

      - label: ":terraform: Terraform fmt + validate"
        key: test-terraform
        command: bash .buildkite/scripts/terraform-validate.sh
        timeout_in_minutes: 10

      - label: ":bash: ShellCheck"
        key: test-shell
        command: docker run --rm -v "$$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x .buildkite/scripts/*.sh
        timeout_in_minutes: 5

  - wait: ~

  # Release steps are only added to builds of main, and only once the pipeline
  # env has RELEASES_ENABLED=true (i.e. the deploy queue exists). Until then main
  # builds stay green and annotate what is missing.
  - label: ":pipeline: Add release steps"
    branches: main
    command: bash .buildkite/scripts/upload-release.sh
